version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: kaibotixing-server_app_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"

  app:
    image: ghcr.io/xk27001/kai-bo-ti-xing:1.0.9-umbrel
    init: true
    restart: on-failure
    user: "1000:1000"
    environment:
      TZ: Asia/Shanghai
      KBTX_SERVER_LISTEN: 0.0.0.0
      KBTX_SERVER_PORT: "8080"
      KBTX_SERVER_MONITOR_AUTO_START: "true"
      KBTX_CONSOLE_CHARSET: UTF-8
      KBTX_CONFIG_FILE: /app/config/db.properties
      KBTX_CRAWLER_PROXY_ENABLED: "true"
      KBTX_CRAWLER_RETRY_COUNT: "15"
    volumes:
      # 首次安装前将阿里云 RDS 配置写入：
      # ${APP_DATA_DIR}/data/config/db.properties
      - ${APP_DATA_DIR}/data/config:/app/config:ro
      - ${APP_DATA_DIR}/data/logs:/app/logs
