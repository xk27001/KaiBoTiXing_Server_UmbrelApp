version: "3.7"

services:
  app:
    image: ${KBTX_IMAGE:-ghcr.io/xk27001/kai-bo-ti-xing:1.0.3-umbrel}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KBTX_HTTP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      KBTX_SERVER_LISTEN: 0.0.0.0
      KBTX_SERVER_PORT: "8080"
      KBTX_SERVER_MONITOR_AUTO_START: "true"
      KBTX_CONSOLE_CHARSET: UTF-8
      KBTX_DB_HOST: db
      KBTX_DB_PORT: "3306"
      KBTX_DB_DATABASE: kai_bo_ti_xing
      KBTX_DB_USERNAME: kaibotixing
      KBTX_DB_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      KBTX_DB_PARAMS: useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      KBTX_DB_AUTO_CREATE: "false"
      KBTX_CRAWLER_PROXY_ENABLED: "true"
      KBTX_CRAWLER_RETRY_COUNT: "15"
    volumes:
      - ./data/logs:/app/logs

  db:
    image: mysql:8.4
    init: true
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: Asia/Shanghai
      MYSQL_DATABASE: kai_bo_ti_xing
      MYSQL_USER: kaibotixing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      start_period: 30s
      timeout: 5s
      retries: 10
