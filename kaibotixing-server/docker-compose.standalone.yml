version: "3.7"

services:
  app:
    image: ${KBTX_IMAGE:-ghcr.io/xk27001/kai-bo-ti-xing:1.0.10-umbrel}
    init: true
    restart: on-failure
    ports:
      - "${KBTX_HTTP_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      KBTX_SERVER_LISTEN: 0.0.0.0
      KBTX_SERVER_PORT: "8080"
      KBTX_SERVER_MONITOR_AUTO_START: "true"
      KBTX_CONSOLE_CHARSET: UTF-8
      KBTX_DB_HOST: "${KBTX_DB_HOST:?set KBTX_DB_HOST in .env}"
      KBTX_DB_PORT: "${KBTX_DB_PORT:-3306}"
      KBTX_DB_DATABASE: "${KBTX_DB_DATABASE:-kai_bo_ti_xing}"
      KBTX_DB_USERNAME: "${KBTX_DB_USERNAME:?set KBTX_DB_USERNAME in .env}"
      KBTX_DB_PASSWORD: "${KBTX_DB_PASSWORD:?set KBTX_DB_PASSWORD in .env}"
      KBTX_DB_PARAMS: "${KBTX_DB_PARAMS:-useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&sslMode=REQUIRED&useSSL=true&requireSSL=true&allowPublicKeyRetrieval=false}"
      KBTX_DB_AUTO_CREATE: "false"
      KBTX_CRAWLER_PROXY_ENABLED: "true"
      KBTX_CRAWLER_RETRY_COUNT: "15"
    volumes:
      - ./data/logs:/app/logs
