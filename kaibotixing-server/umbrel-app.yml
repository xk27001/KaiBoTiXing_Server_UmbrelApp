manifestVersion: 1
id: kaibotixing-server
storage:
  dataRoot: data
category: automation
name: 开播监控
version: "1.0.10-umbrel"
tagline: 自托管监控抖音主播开播状态
description: >-
  KaiBoTiXing 是一个自托管的抖音主播开播监控服务。它按设定的时间间隔并发检查主播直播状态，
  在 Web 控制台中展示实时状态、主播管理、历史开播会话、运行日志和代理池信息。


  数据库使用阿里云 RDS MySQL。首次安装前，请先把包含连接地址、账号和密码的 db.properties
  放入应用数据目录 data/config/，然后从 Umbrel App Store 安装并打开 Web 控制台。


  Umbrel 登录会保护 Web 控制台，应用本身不创建额外账号。
releaseNotes: >-
  1.0.10：修复代理池多轮自动刷新后停止的问题；刷新异常或卡死时自动恢复，
  每轮验证使用独立线程池，并补充回归测试。
