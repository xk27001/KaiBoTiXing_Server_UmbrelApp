manifestVersion: 1
id: kaibotixing-server
name: 开播监控
tagline: 自托管监控抖音主播开播状态
category: automation
version: "1.0.6-umbrel"
port: 8080
description: >-
  KaiBoTiXing 是一个自托管的抖音主播开播监控服务。它按设定的时间间隔并发检查主播直播状态，
  在 Web 控制台中展示实时状态、主播管理、历史开播会话、运行日志和代理池信息。


  此版本将原 JavaFX 服务端转换成了无界面 Web 服务，可在 Umbrel 中通过浏览器访问。


  首次安装后，请在 Web 控制台新增主播。至少需要填写主播昵称和抖音号；如果已知直播间房间号，
  建议同时填写 web_rid，以提高状态检测的成功率。
developer: ren-daguo
website: https://github.com/xk27001/KaiBoTiXing_Server_UmbrelApp
submitter: xk27001
submission: https://github.com/xk27001/KaiBoTiXing_Server_UmbrelApp
repo: https://github.com/xk27001/KaiBoTiXing_Server_UmbrelApp
support: https://github.com/xk27001/KaiBoTiXing_Server_UmbrelApp/issues
icon: https://github.com/xk27001/KaiBoTiXing_Server_UmbrelApp/raw/main/kaibotixing-server/icon.svg
gallery: []
releaseNotes: >-
  1.0.6：启动时确保代理池验证并发数默认值 200 写入数据库 monitor_config，同时保留用户已保存的设置。
dependencies: []
