name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认已经搜索过现有 Issue，并删除日志中的数据库密码和 Token。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 出现...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 部署方式
      options:
        - Umbrel 社区应用商店
        - Umbrel SSH + Docker Compose
        - Windows exe
        - 本地源码运行
        - 其他
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: 1.0.1-umbrel
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      render: shell
    validations:
      required: false
