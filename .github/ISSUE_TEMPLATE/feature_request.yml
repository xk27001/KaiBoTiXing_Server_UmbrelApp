name: 功能建议
description: 提议新功能或改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 当前存在什么限制或不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望如何解决？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 可选方案
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
    validations:
      required: false
